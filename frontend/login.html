<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - TurHR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: {
                            600: '#7c3aed',
                            700: '#6d28d9',
                        },
                    },
                },
            },
        }
    </script>
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center">
        <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-900 mb-2">TurHR</h1>
                <p class="text-gray-600">HR Management System</p>
                <p class="text-sm text-gray-500 mt-1" id="formTitle">Sign in to your account</p>
            </div>

            <div id="errorMessage" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm"></div>

            <form id="authForm" class="space-y-6">
                <div id="nameField" class="hidden">
                    <label for="name" class="block text-sm font-medium text-gray-700 mb-2">Full Name</label>
                    <input
                        type="text"
                        id="name"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-600"
                        placeholder="Enter your full name"
                    />
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input
                        type="email"
                        id="email"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-600"
                        placeholder="Enter your email"
                    />
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-700 mb-2">Password</label>
                    <input
                        type="password"
                        id="password"
                        required
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-600"
                        placeholder="Enter your password"
                    />
                </div>

                <div id="confirmPasswordField" class="hidden">
                    <label for="confirmPassword" class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-600"
                        placeholder="Confirm your password"
                    />
                </div>

                <div id="roleField" class="hidden">
                    <label for="role" class="block text-sm font-medium text-gray-700 mb-2">Role</label>
                    <select
                        id="role"
                        class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-600"
                    >
                        <option value="employee">Employee</option>
                        <option value="manager">Manager</option>
                        <option value="hr_manager">HR Manager</option>
                        <option value="admin">Admin</option>
                        <option value="super_admin">Super Admin</option>
                    </select>
                    <p class="mt-1 text-xs text-gray-500">Select your role in the organization</p>
                </div>

                <button
                    type="submit"
                    id="submitBtn"
                    class="w-full bg-primary-600 text-white py-2.5 rounded-lg hover:bg-primary-700 transition-colors font-medium disabled:opacity-50"
                >
                    Sign In
                </button>
            </form>

            <div class="mt-6 text-center">
                <button
                    type="button"
                    id="toggleForm"
                    class="text-sm text-primary-600 hover:text-primary-700 font-medium"
                >
                    Don't have an account? Sign Up
                </button>
            </div>

            <div id="demoCredentials" class="mt-4 text-center text-sm text-gray-600">
                <p>Demo credentials: admin@hrsys.com / password123</p>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        let isSignUp = false;

        document.getElementById('toggleForm').addEventListener('click', () => {
            isSignUp = !isSignUp;
            const nameField = document.getElementById('nameField');
            const confirmPasswordField = document.getElementById('confirmPasswordField');
            const roleField = document.getElementById('roleField');
            const formTitle = document.getElementById('formTitle');
            const submitBtn = document.getElementById('submitBtn');
            const toggleBtn = document.getElementById('toggleForm');
            const demoCredentials = document.getElementById('demoCredentials');

            if (isSignUp) {
                nameField.classList.remove('hidden');
                confirmPasswordField.classList.remove('hidden');
                roleField.classList.remove('hidden');
                formTitle.textContent = 'Create your account';
                submitBtn.textContent = 'Sign Up';
                toggleBtn.textContent = 'Already have an account? Sign In';
                demoCredentials.classList.add('hidden');
            } else {
                nameField.classList.add('hidden');
                confirmPasswordField.classList.add('hidden');
                roleField.classList.add('hidden');
                formTitle.textContent = 'Sign in to your account';
                submitBtn.textContent = 'Sign In';
                toggleBtn.textContent = "Don't have an account? Sign Up";
                demoCredentials.classList.remove('hidden');
            }
        });

        document.getElementById('authForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');
            
            errorDiv.classList.add('hidden');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="loading"></span> Processing...';

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            if (isSignUp) {
                const name = document.getElementById('name').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const role = document.getElementById('role').value;

                if (password !== confirmPassword) {
                    errorDiv.textContent = 'Passwords do not match';
                    errorDiv.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign Up';
                    return;
                }

                if (password.length < 6) {
                    errorDiv.textContent = 'Password must be at least 6 characters';
                    errorDiv.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign Up';
                    return;
                }

                const result = await auth.register(name, email, password, role);
                if (result.success) {
                    window.location.href = '/dashboard.html';
                } else {
                    errorDiv.textContent = result.message;
                    errorDiv.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign Up';
                }
            } else {
                const result = await auth.login(email, password);
                if (result.success) {
                    window.location.href = '/dashboard.html';
                } else {
                    errorDiv.textContent = result.message;
                    errorDiv.classList.remove('hidden');
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Sign In';
                }
            }
        });
    </script>
</body>
</html>
