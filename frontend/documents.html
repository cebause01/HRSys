<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents - TurHR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50">
    <div class="flex h-screen">
        <div id="sidebar"></div>
        <div class="flex-1 flex flex-col overflow-hidden">
            <div id="header"></div>
            <main class="flex-1 overflow-y-auto p-6">
                <div class="space-y-6">
                    <h1 class="text-2xl font-bold text-gray-900">Document Management</h1>
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4">
                        <div id="documentsList"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script>
        if (!auth.isAuthenticated()) window.location.href = '/login.html';
        
        const user = auth.getUser();
        document.getElementById('sidebar').innerHTML = components.sidebar(user);
        document.getElementById('header').innerHTML = components.header(user, 'Documents');

        async function loadDocuments() {
            try {
                const query = user.role === 'employee' ? '' : `?employeeId=${user.id}`;
                const response = await api.get(`/documents${query}`);
                const documents = response.data;

                if (documents.length === 0) {
                    document.getElementById('documentsList').innerHTML = '<p class="text-center text-gray-500 p-8">No documents</p>';
                    return;
                }

                document.getElementById('documentsList').innerHTML = `
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Document Name</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Type</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Employee</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Actions</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            ${documents.map(doc => `
                                <tr class="hover:bg-gray-50">
                                    <td class="px-6 py-4 whitespace-nowrap text-sm font-medium">${doc.name}</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${doc.type}</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm">${doc.employeeId?.name || 'N/A'}</td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <span class="px-2 py-1 rounded-full text-xs font-medium ${
                                            doc.status === 'signed' ? 'bg-green-100 text-green-800' :
                                            doc.status === 'expired' ? 'bg-red-100 text-red-800' :
                                            'bg-yellow-100 text-yellow-800'
                                        }">${doc.status}</span>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        ${doc.status === 'pending' && doc.employeeId?._id === user.id ? 
                                            `<button onclick="signDocument('${doc._id}')" class="text-sm text-primary-600 hover:text-primary-700">Sign</button>` :
                                            '<span class="text-xs text-gray-500">View</span>'
                                        }
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (error) {
                document.getElementById('documentsList').innerHTML = '<p class="text-red-600">Error loading documents</p>';
            }
        }

        async function signDocument(id) {
            if (confirm('Are you sure you want to sign this document?')) {
                try {
                    await api.put(`/documents/${id}/sign`, {});
                    alert('Document signed successfully!');
                    loadDocuments();
                } catch (error) {
                    alert('Failed to sign document');
                }
            }
        }

        loadDocuments();
    </script>
</body>
</html>
