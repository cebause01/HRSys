<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recruitment - TurHR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50">
    <div class="flex h-screen">
        <div id="sidebar"></div>
        <div class="flex-1 flex flex-col overflow-hidden">
            <div id="header"></div>
            <main class="flex-1 overflow-y-auto p-6">
                <div class="space-y-6">
                    <div class="flex items-center justify-between">
                        <h1 class="text-2xl font-bold text-gray-900">Recruitment & Hiring</h1>
                        <button onclick="openJobModal()" class="px-4 py-2 bg-primary-600 text-white rounded-lg hover:bg-primary-700">Post Job</button>
                    </div>

                    <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                        <div class="lg:col-span-2">
                            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4 mb-6">
                                <h2 class="text-lg font-semibold mb-4">Jobs</h2>
                                <div id="jobsList"></div>
                            </div>
                        </div>

                        <div>
                            <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4">
                                <h2 class="text-lg font-semibold mb-4">Candidates</h2>
                                <div id="candidatesList"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/modal.js"></script>
    <script>
        if (!auth.isAuthenticated()) window.location.href = '/login.html';
        
        const user = auth.getUser();
        document.getElementById('sidebar').innerHTML = components.sidebar(user);
        document.getElementById('header').innerHTML = components.header(user, 'Recruitment');

        async function loadJobs() {
            try {
                const response = await api.get('/jobs');
                const jobs = response.data;

                document.getElementById('jobsList').innerHTML = jobs.length === 0 ? 
                    '<p class="text-gray-500 text-center p-4">No jobs posted</p>' :
                    jobs.map(job => `
                        <div class="border-b border-gray-200 p-4 hover:bg-gray-50">
                            <div class="flex items-start justify-between">
                                <div class="flex-1">
                                    <h3 class="font-semibold text-gray-900">${job.title}</h3>
                                    <p class="text-sm text-gray-600">${job.department} • ${job.location || 'Remote'}</p>
                                    <p class="text-sm text-gray-500 mt-2 line-clamp-2">${job.description}</p>
                                </div>
                                <span class="px-2 py-1 rounded-full text-xs font-medium ${
                                    job.status === 'published' ? 'bg-green-100 text-green-800' :
                                    job.status === 'closed' ? 'bg-gray-100 text-gray-800' :
                                    'bg-yellow-100 text-yellow-800'
                                }">${job.status}</span>
                            </div>
                            <div class="mt-3 flex gap-2">
                                <button onclick="viewCandidates('${job._id}')" class="text-sm text-primary-600 hover:text-primary-700">View Candidates</button>
                                <button onclick="postToPlatforms('${job._id}')" class="text-sm text-primary-600 hover:text-primary-700">Post to Platforms</button>
                            </div>
                        </div>
                    `).join('');
            } catch (error) {
                document.getElementById('jobsList').innerHTML = '<p class="text-red-600">Error loading jobs</p>';
            }
        }

        async function loadCandidates() {
            try {
                const response = await api.get('/candidates');
                const candidates = response.data.slice(0, 10);

                document.getElementById('candidatesList').innerHTML = candidates.length === 0 ?
                    '<p class="text-gray-500 text-center p-4 text-sm">No candidates</p>' :
                    candidates.map(c => `
                        <div class="border-b border-gray-200 p-3 hover:bg-gray-50">
                            <div class="flex items-center justify-between">
                                <div>
                                    <p class="font-medium text-sm">${c.firstName} ${c.lastName}</p>
                                    <p class="text-xs text-gray-500">${c.jobId?.title || 'N/A'}</p>
                                </div>
                                <span class="px-2 py-1 rounded-full text-xs font-medium ${
                                    c.stage === 'hired' ? 'bg-green-100 text-green-800' :
                                    c.stage === 'rejected' ? 'bg-red-100 text-red-800' :
                                    'bg-blue-100 text-blue-800'
                                }">${c.stage}</span>
                            </div>
                        </div>
                    `).join('');
            } catch (error) {
                document.getElementById('candidatesList').innerHTML = '<p class="text-red-600 text-sm">Error loading candidates</p>';
            }
        }

        function openJobModal() {
            alert('Job posting modal - to be implemented');
        }

        function viewCandidates(jobId) {
            window.location.href = `/candidates.html?jobId=${jobId}`;
        }

        function postToPlatforms(jobId) {
            alert('Post to LinkedIn, Indeed, Glassdoor - to be implemented');
        }

        loadJobs();
        loadCandidates();
    </script>
</body>
</html>
