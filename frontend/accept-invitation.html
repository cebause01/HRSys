<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Accept Invitation - TurHR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50">
    <div class="min-h-screen flex items-center justify-center">
        <div class="max-w-md w-full bg-white rounded-lg shadow-lg p-8">
            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-900 mb-2">Welcome to TurHR</h1>
                <p class="text-gray-600">Complete your registration</p>
            </div>

            <div id="invitationInfo" class="mb-6 p-4 bg-primary-50 rounded-lg hidden">
                <p class="text-sm text-gray-700"></p>
            </div>

            <div id="errorMessage" class="hidden mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm"></div>

            <form id="acceptForm" class="space-y-6">
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
                    <input type="email" id="email" disabled class="w-full px-4 py-2 border border-gray-300 rounded-lg bg-gray-50 text-gray-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Set Password</label>
                    <input type="password" id="password" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500">
                </div>

                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-2">Confirm Password</label>
                    <input type="password" id="confirmPassword" required class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-primary-500">
                </div>

                <button type="submit" id="submitBtn" class="w-full bg-primary-600 text-white py-2.5 rounded-lg hover:bg-primary-700 transition-colors font-medium disabled:opacity-50">
                    Accept Invitation & Create Account
                </button>
            </form>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script>
        const token = window.location.pathname.split('/').pop();
        
        async function loadInvitation() {
            try {
                const response = await api.get(`/invitations/${token}`);
                const data = response.data;
                
                document.getElementById('email').value = data.email;
                document.getElementById('invitationInfo').innerHTML = `
                    <p class="text-sm text-gray-700">
                        <strong>${data.name}</strong>, you've been invited by <strong>${data.invitedBy}</strong>
                    </p>
                    <p class="text-xs text-gray-600 mt-1">Role: ${data.role.replace('_', ' ')}</p>
                `;
                document.getElementById('invitationInfo').classList.remove('hidden');
            } catch (error) {
                document.getElementById('errorMessage').textContent = error.response?.data?.message || 'Invalid invitation link';
                document.getElementById('errorMessage').classList.remove('hidden');
                document.getElementById('acceptForm').classList.add('hidden');
            }
        }

        document.getElementById('acceptForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const errorDiv = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');
            
            errorDiv.classList.add('hidden');
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                errorDiv.textContent = 'Passwords do not match';
                errorDiv.classList.remove('hidden');
                return;
            }

            if (password.length < 6) {
                errorDiv.textContent = 'Password must be at least 6 characters';
                errorDiv.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = 'Creating Account...';

            try {
                const response = await api.post(`/invitations/accept/${token}`, { password });
                localStorage.setItem('token', response.token);
                localStorage.setItem('user', JSON.stringify(response.user));
                window.location.href = '/dashboard.html';
            } catch (error) {
                errorDiv.textContent = error.response?.data?.message || 'Failed to accept invitation';
                errorDiv.classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = 'Accept Invitation & Create Account';
            }
        });

        loadInvitation();
    </script>
</body>
</html>
