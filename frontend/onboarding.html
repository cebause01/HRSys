<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Onboarding - TurHR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50">
    <div class="flex h-screen">
        <div id="sidebar"></div>
        <div class="flex-1 flex flex-col overflow-hidden">
            <div id="header"></div>
            <main class="flex-1 overflow-y-auto p-6">
                <div class="space-y-6">
                    <h1 class="text-2xl font-bold text-gray-900">Onboarding & Offboarding</h1>
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4">
                        <div id="onboardingList"></div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script>
        if (!auth.isAuthenticated()) window.location.href = '/login.html';
        
        const user = auth.getUser();
        document.getElementById('sidebar').innerHTML = components.sidebar(user);
        document.getElementById('header').innerHTML = components.header(user, 'Onboarding');

        async function loadOnboarding() {
            try {
                const response = await api.get('/onboarding');
                const onboardings = response.data;

                if (onboardings.length === 0) {
                    document.getElementById('onboardingList').innerHTML = '<p class="text-center text-gray-500 p-8">No onboarding records</p>';
                    return;
                }

                document.getElementById('onboardingList').innerHTML = onboardings.map(onb => {
                    const completedTasks = onb.tasks.filter(t => t.status === 'completed').length;
                    const totalTasks = onb.tasks.length;
                    const progress = totalTasks > 0 ? (completedTasks / totalTasks * 100) : 0;

                    return `
                        <div class="border-b border-gray-200 p-4">
                            <div class="flex items-center justify-between mb-3">
                                <div>
                                    <h3 class="font-semibold text-gray-900">${onb.employeeId?.name || 'Employee'}</h3>
                                    <p class="text-sm text-gray-600">Start Date: ${new Date(onb.startDate).toLocaleDateString()}</p>
                                </div>
                                <span class="px-2 py-1 rounded-full text-xs font-medium ${
                                    onb.status === 'completed' ? 'bg-green-100 text-green-800' :
                                    onb.status === 'in_progress' ? 'bg-blue-100 text-blue-800' :
                                    'bg-gray-100 text-gray-800'
                                }">${onb.status}</span>
                            </div>
                            <div class="mb-2">
                                <div class="flex items-center justify-between text-sm mb-1">
                                    <span>Progress</span>
                                    <span>${completedTasks}/${totalTasks} tasks</span>
                                </div>
                                <div class="w-full bg-gray-200 rounded-full h-2">
                                    <div class="bg-primary-600 h-2 rounded-full" style="width: ${progress}%"></div>
                                </div>
                            </div>
                            <div class="mt-3">
                                <details class="text-sm">
                                    <summary class="cursor-pointer text-primary-600 hover:text-primary-700">View Tasks</summary>
                                    <div class="mt-2 space-y-1">
                                        ${onb.tasks.map(task => `
                                            <div class="flex items-center gap-2 text-xs">
                                                <span class="${task.status === 'completed' ? 'text-green-600' : 'text-gray-400'}">${task.status === 'completed' ? '✓' : '○'}</span>
                                                <span>${task.task} (${task.department})</span>
                                            </div>
                                        `).join('')}
                                    </div>
                                </details>
                            </div>
                        </div>
                    `;
                }).join('');
            } catch (error) {
                document.getElementById('onboardingList').innerHTML = '<p class="text-red-600">Error loading onboarding records</p>';
            }
        }

        loadOnboarding();
    </script>
</body>
</html>
