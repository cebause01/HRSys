<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payroll - TurHR</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50">
    <div class="flex h-screen">
        <div id="sidebar"></div>
        <div class="flex-1 flex flex-col overflow-hidden">
            <div id="header"></div>
            <main class="flex-1 overflow-y-auto p-6">
                <div class="space-y-6">
                    <h1 class="text-2xl font-bold text-gray-900">Payroll Management</h1>
                    <div class="bg-white rounded-lg shadow-sm border border-gray-200 p-4">
                        <div class="flex items-center gap-4 mb-6">
                            <select id="monthFilter" class="px-4 py-2 border border-gray-300 rounded-lg"></select>
                            <select id="yearFilter" class="px-4 py-2 border border-gray-300 rounded-lg"></select>
                        </div>
                        <div id="payrollTable" class="overflow-x-auto">
                            <div class="loading"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/components.js"></script>
    <script src="js/modal.js"></script>
    <script>
        if (!auth.isAuthenticated()) window.location.href = '/login.html';
        
        const user = auth.getUser();
        document.getElementById('sidebar').innerHTML = components.sidebar(user);
        document.getElementById('header').innerHTML = components.header(user, 'Payroll');

        const months = ['January','February','March','April','May','June','July','August','September','October','November','December'];
        const monthSelect = document.getElementById('monthFilter');
        const yearSelect = document.getElementById('yearFilter');
        
        months.forEach((m, i) => {
            monthSelect.innerHTML += `<option value="${i+1}">${m}</option>`;
        });
        monthSelect.value = new Date().getMonth() + 1;

        for (let i = 0; i < 5; i++) {
            const year = new Date().getFullYear() - i;
            yearSelect.innerHTML += `<option value="${year}">${year}</option>`;
        }

        async function loadPayroll() {
            try {
                const month = monthSelect.value;
                const year = yearSelect.value;
                const response = await api.get(`/payroll?month=${month}&year=${year}`);
                const payrolls = response.data;

                if (payrolls.length === 0) {
                    document.getElementById('payrollTable').innerHTML = '<p class="text-center text-gray-500 p-8">No payroll records found</p>';
                    return;
                }

                document.getElementById('payrollTable').innerHTML = `
                    <table class="w-full">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Employee</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Base Salary</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Allowances</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Deductions</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Net Salary</th>
                                <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase">Status</th>
                            </tr>
                        </thead>
                        <tbody class="bg-white divide-y divide-gray-200">
                            ${payrolls.map(p => `
                                <tr class="hover:bg-gray-50">
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <div class="flex items-center gap-3">
                                            <div class="w-10 h-10 rounded-full bg-primary-100 flex items-center justify-center">
                                                <span class="text-primary-700 font-semibold text-sm">${p.employeeId?.name?.charAt(0) || 'E'}</span>
                                            </div>
                                            <div>
                                                <div class="text-sm font-medium text-gray-900">${p.employeeId?.name || 'N/A'}</div>
                                                <div class="text-xs text-gray-500">${p.employeeId?.employeeId || ''}</div>
                                            </div>
                                        </div>
                                    </td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm">$${p.baseSalary?.toLocaleString() || '0.00'}</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-green-600">+$${p.allowances?.toLocaleString() || '0.00'}</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm text-red-600">-$${p.deductions?.toLocaleString() || '0.00'}</td>
                                    <td class="px-6 py-4 whitespace-nowrap text-sm font-semibold">$${p.netSalary?.toLocaleString() || '0.00'}</td>
                                    <td class="px-6 py-4 whitespace-nowrap">
                                        <span class="px-2 py-1 rounded-full text-xs font-medium ${
                                            p.status === 'paid' ? 'bg-green-100 text-green-800' :
                                            p.status === 'pending' ? 'bg-yellow-100 text-yellow-800' :
                                            'bg-gray-100 text-gray-800'
                                        }">${p.status.charAt(0).toUpperCase() + p.status.slice(1)}</span>
                                    </td>
                                </tr>
                            `).join('')}
                        </tbody>
                    </table>
                `;
            } catch (error) {
                document.getElementById('payrollTable').innerHTML = '<p class="text-red-600">Error loading payroll</p>';
            }
        }

        monthSelect.addEventListener('change', loadPayroll);
        yearSelect.addEventListener('change', loadPayroll);
        loadPayroll();
    </script>
</body>
</html>
